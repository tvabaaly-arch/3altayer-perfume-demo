<link rel="icon" href="assets/img/logo-blue.png" type="image/png">

<body data-route="home">

<!-- Brand intro (once per session) -->
<div class="intro" id="intro" aria-hidden="true">
  <div class="intro-logo"><img class="lg-orange" src="assets/img/logo-orange.png" alt=""><img class="lg-blue" src="assets/img/logo-blue.png" alt=""></div>
</div>

<!-- Announcement bar -->
<div class="ann" id="ann" role="region" data-t-attr="aria-label:brand">
  <p class="on" data-t="ann1"></p><p data-t="ann2"></p><p data-t="ann3"></p>
</div>

<!-- Header -->
<header class="hdr" id="hdr">
  <div class="hdr-in">
    <button class="icon-btn hdr-menu" data-open="menu" data-t-attr="aria-label:menu"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg></button>
    <a class="logo" href="#/" data-t-attr="aria-label:brand"><img class="lg-orange" src="assets/img/logo-orange.png" alt=""><img class="lg-blue" src="assets/img/logo-blue.png" alt=""></a>
    <nav class="nav" data-t-attr="aria-label:shop"><ul id="navList"></ul></nav>
    <button class="hdr-search" data-open="search"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><span id="hdrSearchLabel"></span></button>
    <div class="hdr-act">
      <button class="icon-btn hdr-search-ic" data-open="search" data-t-attr="aria-label:search"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></button>
      <button class="lang-btn" id="langBtn" data-lang-toggle></button>
      <a class="icon-btn hdr-wish" href="#/wishlist" data-t-attr="aria-label:wishlist"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg><i class="badge" data-badge="wish" hidden></i></a>
      <button class="icon-btn" data-open="cart" data-cart-label><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2L5 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg><i class="badge" data-badge="cart" hidden></i></button>
    </div>
  </div>
  <div class="mega" id="mega"></div>
</header>

<!-- Mobile prominent search -->
<div class="msearch"><button class="msearch-btn" data-open="search"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><span data-t="searchPh"></span></button></div>

<main id="main" tabindex="-1"><div id="app"></div></main>

<footer class="ftr" id="footer"></footer>

<!-- Mobile tab bar -->
<nav class="tabbar" id="tabbar" data-t-attr="aria-label:menu"></nav>

<!-- Overlays -->
<div class="scrim" id="scrim"></div>
<aside class="drawer drawer-start" id="dMenu" role="dialog" aria-modal="true" aria-labelledby="dMenuT" hidden>
  <div class="drawer-head"><h2 class="drawer-title" id="dMenuT"></h2><button class="icon-btn" data-close data-t-attr="aria-label:close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="drawer-body"></div>
</aside>

  <div class="drawer-body"></div>
